<main class="app">
  <svg xmlns="http://www.w3.org/2000/svg" style="position: absolute; left: -1200em;">
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"></feGaussianBlur>
      <feOffset dx="0" dy="0"></feOffset>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </svg>

  <section class="main" id="root">
    <section class="result">
      <div class="result__logo"><img src="img/melody-logo.png" alt="Угадай мелодию" width="186" height="83"></div>
      <h2 class="result__title">Страница не найдена</h2>
      <p class="result__total">404. Page not found</p>
      <a class="replay result__home-link" [routerLink]=AppRoutes.WELCOME>Вернуться на главный экран</a>
    </section>
  </section>
</main>

<app-header></app-header>
